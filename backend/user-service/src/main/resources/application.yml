server:
  port: 8082

spring:
  application:
    name: user-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/user-db}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          multiplier: 2.0
          max-attempts: 3

app:
  audit-log:
    retention-days: ${APP_AUDIT_LOG_RETENTION_DAYS:730}
  root-admin:
    user-id: ${MKFMM_ROOT_USER:admin}

management:
  endpoints:
    web:
      exposure:
        include: health
