server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=1
        - id: resource-service
          uri: ${RESOURCE_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/api/resources/**
          filters:
            - StripPrefix=1
        - id: dataio-service
          uri: ${DATAIO_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/dataio/**
          filters:
            - StripPrefix=1
        - id: deploy-service
          uri: ${DEPLOY_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/deploy/**
          filters:
            - StripPrefix=1
        - id: history-service
          uri: ${HISTORY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/history/**
          filters:
            - StripPrefix=1

jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
  issuer: mkfmm-auth

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health
