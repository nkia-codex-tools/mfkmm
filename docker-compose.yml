services:
  mongodb:
    image: mongo:7
    container_name: mkfmm-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mkfmm-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: mkfmm-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mkfmm-network

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: mkfmm-auth-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MONGODB_URI=mongodb://mongodb:27017/mkfmm-auth
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASS=guest
      - MKFMM_ROOT_USER=rootadmin
      - MKFMM_ROOT_PASSWORD=changeme123
      - JWT_PRIVATE_KEY_PATH=/app/keys/private.pem
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure
    networks:
      - mkfmm-network

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: mkfmm-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - JWT_PUBLIC_KEY_PATH=/app/keys/public.pem
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - AUTH_SERVICE_URL=http://auth-service:8081
      - USER_SERVICE_URL=http://user-service:8082
      - HISTORY_SERVICE_URL=http://history-service:8083
      - RESOURCE_SERVICE_URL=http://resource-service:8084
      - DATAIO_SERVICE_URL=http://dataio-service:8085
      - DEPLOY_SERVICE_URL=http://deploy-service:8086
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure
    networks:
      - mkfmm-network

  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: mkfmm-user-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/user-db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - APP_AUDIT_LOG_RETENTION_DAYS=730
      - MKFMM_ROOT_USER=rootadmin
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure
    networks:
      - mkfmm-network

  history-service:
    build:
      context: ./backend/history-service
      dockerfile: Dockerfile
    container_name: mkfmm-history-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/history-db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - APP_RETENTION_SEARCH_DAYS=180
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure
    networks:
      - mkfmm-network

  resource-service:
    build:
      context: ./backend/resource-service
      dockerfile: Dockerfile
    container_name: mkfmm-resource-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/resource-db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - APP_SIMILARITY_THRESHOLD=3
      - APP_SIMILARITY_MAX_RESULTS=5
      - APP_HARD_DELETE_RETENTION_DAYS=30
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8084/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure
    networks:
      - mkfmm-network

  dataio-service:
    build:
      context: ./backend/dataio-service
      dockerfile: Dockerfile
    container_name: mkfmm-dataio-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/dataio-db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - RESOURCE_SERVICE_URL=http://resource-service:8084
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      resource-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure
    networks:
      - mkfmm-network

  deploy-service:
    build:
      context: ./backend/deploy-service
      dockerfile: Dockerfile
    container_name: mkfmm-deploy-service
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/deploy-db
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - DATAIO_SERVICE_URL=http://dataio-service:8085
    volumes:
      - deploy-data:/app/deployments
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      dataio-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: on-failure
    networks:
      - mkfmm-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mkfmm-frontend
    ports:
      - "3000:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    restart: on-failure
    networks:
      - mkfmm-network

volumes:
  mongodb-data:
  rabbitmq-data:
  deploy-data:

networks:
  mkfmm-network:
    driver: bridge
